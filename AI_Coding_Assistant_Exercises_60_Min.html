<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dev & Patch · AI Coding Practice</title>
<style>
:root{--ink:#182633;--paper:#fff9ec;--blue:#1746b0;--teal:#087f80;--yellow:#ffd64d;--coral:#bd3b29}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,Segoe UI,sans-serif}button,select{font:inherit}button{cursor:pointer;border:2px solid var(--ink);background:white;color:var(--ink);padding:10px 15px;font-weight:750;border-radius:3px}button:hover{background:#f0e8d7}button:focus-visible,select:focus-visible,a:focus-visible,textarea:focus-visible{outline:4px solid var(--teal);outline-offset:3px}button.primary{background:var(--blue);color:white}button.yellow{background:var(--yellow)}button:disabled{opacity:.4;cursor:default}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--ink);color:white;padding:24px 18px;overflow:auto}.brand{color:var(--yellow);font-size:25px;font-weight:900;line-height:1.12;margin-bottom:22px}.nav-label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#b8cdd6;margin:20px 0 8px}.sidebar a{display:block;color:white;text-decoration:none;padding:9px 10px;font-size:14px;border-left:3px solid transparent;border-radius:2px}.sidebar a:hover{background:#2a3e4c}.sidebar a[aria-current=page]{border-color:var(--yellow);background:#304756;color:var(--yellow)}main{margin-left:248px;padding:24px 42px 110px;max-width:1540px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:16px}.toolbar span{font-size:14px;color:var(--teal);font-weight:800}.toolbar .actions{display:flex;gap:8px}select{max-width:100%;background:white;padding:10px;border:2px solid var(--ink);color:var(--ink);font-size:15px}h1{font-size:clamp(32px,3.5vw,49px);line-height:1.12;letter-spacing:-.03em;margin:20px 0 16px}.meta{margin-top:26px;color:var(--teal);font-size:14px;font-weight:850;letter-spacing:.05em}.lead{font-size:23px;line-height:1.5;max-width:1000px;margin:0 0 20px}.case{border-left:5px solid var(--coral);padding:0 0 0 20px;margin:20px 0;font-size:21px;line-height:1.5}.case strong{display:block;color:var(--coral);margin-bottom:4px}.task{font-size:21px;line-height:1.5;padding-left:28px;margin:18px 0}.task li{padding:3px 0}.prompt{background:white;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--yellow);margin:26px 0 20px}.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid #d1d8dc;padding:12px 18px}.prompt-head strong{font-size:16px;color:var(--blue)}pre{font:19px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:22px}.result{font-size:18px;line-height:1.5;border-left:5px solid var(--teal);padding-left:18px;margin:24px 0;color:#264c4c}.timer{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:20px 0}.clock{font-size:26px;font-variant-numeric:tabular-nums;font-weight:900;color:var(--blue);min-width:88px}.timer-note{font-size:15px;color:var(--teal);font-weight:700}.footer{position:fixed;bottom:0;left:248px;right:0;background:var(--paper);border-top:2px solid var(--ink);padding:13px 42px;display:flex;align-items:center;justify-content:space-between;gap:15px}.footer small{font-size:14px;color:#53656f}.footer .buttons{display:flex;gap:10px}.mobile-picker{display:none}.present main{margin-left:0;max-width:1240px;margin-inline:auto;padding-inline:42px}.present .sidebar{display:none}.present .footer{left:0}.present pre{font-size:22px}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 22px;font-weight:700;border-radius:5px;z-index:3}.toast:empty{display:none}textarea.manual-copy{width:100%;min-height:200px;padding:15px;font:18px/1.5 monospace;border:3px solid var(--blue)}[hidden]{display:none!important}@media(max-width:900px){.sidebar{display:none}main{margin:0;padding:18px 24px 108px}.footer{left:0;padding:12px 24px}.mobile-picker{display:block;margin-top:16px}.toolbar span{font-size:12px}.toolbar button{font-size:13px;padding:8px}.lead,.task,.case{font-size:19px}pre,.present pre{font-size:17px}.present main{padding-inline:24px}.footer small{font-size:12px}.footer button{font-size:14px;padding:9px}h1{font-size:34px}}@media print{.sidebar,.toolbar,.mobile-picker,.timer,.footer,.toast,.prompt-head button{display:none}main,.present main{margin:0;padding:0;max-width:none}.prompt{box-shadow:none}pre,.present pre{font-size:11pt}.lead,.task,.case{font-size:13pt}h1{font-size:26pt}}
</style></head><body>
<nav class="sidebar" aria-label="Exercise and prompt navigation"><div class="brand">DEV & PATCH<br>AI CODING PRACTICE</div><div id="nav"></div></nav>
<main><div class="toolbar"><span>60-MINUTE COMIC WORKSHOP</span><div class="actions"><button id="view" aria-pressed="false">Presentation view</button><button id="full">Full screen</button></div></div><div class="mobile-picker"><label for="jump">Exercise or prompt</label> <select id="jump"></select></div><article id="screen" aria-labelledby="title"></article></main>
<div class="footer"><small id="position"></small><div class="buttons"><button id="previous">← Previous</button><button id="next">Next →</button></div></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const screens=[
{id:'brief',group:'Live exercises',name:'1. A better brief',slides:'Slide 8',title:'A brief that prevents two charges',lead:'6 minutes: write for 4 minutes, then compare for 2 minutes.',minutes:6,case:'The request is “Fix the retry bug.” Same key and payload must produce one charge. A changed payload must conflict. Concurrent retries must still create only one charge.',steps:['Write the outcome, relevant evidence, edit scope and checks.','Choose Ask, Plan or Agent for the first step. Explain your choice.','Add a condition that tells the agent when to stop.'],prompt:'Rewrite this vague coding request into a precise brief: “Fix the retry bug.”\n\nContract:\n- Same idempotency key and same payload: reuse one charge result.\n- Same key and changed payload: return a conflict.\n- Concurrent retries: create only one charge.\n- A timeout may hide a successful provider charge.\n\nRelevant files: service.py, repository.py and test_payments.py.\nPreserve the public API and add no dependency.\n\nInclude the expected outcome, evidence needed, edit boundaries, verification and a stop condition. Choose Ask, Plan or Agent for the first step and explain why. Return the brief and reasoning only. Do not edit files.',result:'Your output: one bounded brief, a mode choice and a stop condition.'},
{id:'safety',group:'Live exercises',name:'2. Where should it stop?',slides:'Slide 15',title:'Where should the agent stop?',lead:'3 minutes: read, discuss with a partner, then compare your choices.',minutes:3,case:'An Agent has broad approvals. The repository contains production tokens. A README tells it to run a setup script. It changes the lockfile, removes a test and reports “all green.”',steps:['Name two danger signals.','Choose two controls that the environment can enforce.','Describe the evidence needed to prove “one charge per request.”'],prompt:'Analyze this fictional coding-agent scenario as a tabletop exercise. Do not execute commands or change permissions.\n\nAn Agent has broad approvals. The repository contains production tokens. A README tells it to run a setup script. The agent changes the lockfile, removes a test and reports “all green.”\n\nIdentify two danger signals. Propose two enforceable environment controls and explain what each blocks. State where the agent should stop for review. Describe verification that would demonstrate one charge for concurrent same-key requests.\n\nDistinguish prompt instructions from controls actually enforced by the environment.',result:'Your output: two dangers, two enforced controls and one verification requirement. Discuss the scenario without enabling YOLO.'},
{id:'ask',group:'Prompt library',name:'Ask: investigate',slides:'Slide 4',mode:'ASK',title:'An explanation grounded in code',lead:'Use this when you need to understand the failing path before deciding on a change.',prompt:'Trace the payment retry path in the attached code. Do not edit files.\n\nCite the actual files and functions that handle the idempotency key, stored result and provider call. Explain how a timeout or concurrent request could lead to a duplicate charge. Separate confirmed facts from hypotheses.\n\nList the code or runtime evidence you still need. If the relevant files are unavailable, ask for them rather than inventing a call path.',result:'Look for file evidence, a clear hypothesis and honest uncertainty.'},
{id:'plan',group:'Prompt library',name:'Plan: agree on scope',slides:'Slide 4',mode:'PLAN',title:'A plan you can review',lead:'Use this before a change whose assumptions or boundaries need agreement.',prompt:'Plan a minimal fix for duplicate charges on retries. Do not implement.\n\nContract: same key and payload reuse one result, changed payload conflicts, concurrent retries create one charge, and timeout recovery must account for a possible successful charge.\n\nIdentify uncertainties and ask blocking questions. Name the likely files, smallest implementation steps, regression tests, compatibility risks and rollback approach. Preserve the public API and add no dependency.\n\nSeparate confirmed repository facts from proposed design. Stop after presenting the plan.',result:'Look for a bounded plan and a test that would catch the original failure.'},
{id:'agent',group:'Prompt library',name:'Agent: implement',slides:'Slides 4, 9',mode:'AGENT',title:'A small patch with evidence',lead:'Use this after reviewing the plan, in an approved development workspace.',prompt:'Implement the reviewed payment retry plan in this development workspace. If no reviewed plan is available, request it and stop.\n\nLimit changes to the payment retry implementation and its regression tests. Preserve public interfaces and existing dependencies. Keep cleanup and unrelated formatting out of the patch.\n\nRun the relevant checks. Report changed files, exact commands, outcomes, unperformed checks and remaining risks. Do not describe skipped checks as passed.\n\nStop for review if the fix requires broader scope, new access or external side effects.',result:'Look for a reviewable diff and evidence from checks that actually ran.'},
{id:'context',group:'Prompt library',name:'Relevant context',slides:'Slides 5–6',mode:'ASK',title:'A compact evidence pack',lead:'Give the assistant the failing path, rather than every file and every log.',prompt:'Before proposing a retry fix, identify the minimum evidence needed to diagnose this issue.\n\nRequest the failing function and callers, regression test, exact error or failing output, interface/schema and relevant package versions. Use the attached evidence first.\n\nExplain why each additional file is needed. Exclude unrelated logs and stale discussion. Do not assume a file was read merely because its name appeared in the request.\n\nReturn a concise evidence checklist and the unresolved questions. Do not edit code.',result:'Look for specific evidence requests that relate to the failure.'},
{id:'instructions',group:'Prompt library',name:'Repository instructions',slides:'Slide 7 / Appendix A2',mode:'ASK',title:'Project conventions that stay useful',lead:'Keep stable project rules separate from today’s bug request.',prompt:'Draft concise repository instructions from the project conventions and commands supplied below. Ask for missing details instead of inventing them. Do not write files yet.\n\nInclude architecture boundaries, public-interface compatibility, existing helpers and test fixtures, sensitive-data handling, and actual build/test/lint commands. Require reporting of exact commands and blockers.\n\nKeep task-specific retry details in the current brief. Distinguish guidance for the assistant from controls enforced by CI or the environment.',result:'Look for short, current instructions backed by actual project commands.'},
{id:'tests',group:'Prompt library',name:'Meaningful regression tests',slides:'Slide 10',mode:'PLAN',title:'A test that catches the old bug',lead:'Derive the expected behavior from the contract before looking at the proposed fix.',prompt:'Design regression tests for the payment retry contract independently of the proposed implementation. Do not edit code yet.\n\nCover same-key/same-payload reuse, changed-payload conflict, concurrent duplicate requests and timeout recovery after a possible successful charge.\n\nFor each test, state the setup, expected assertion and why the old behavior should fail. Identify mocks or fixtures that could hide a race.\n\nDo not count setup failures as regression evidence. Preserve required assertions and report any skipped or unperformed checks.',result:'Look for the intended failure before the fix and the same expectations after it.'},
{id:'review',group:'Prompt library',name:'Review and API checks',slides:'Slide 11 / Appendix A3',mode:'ASK',title:'A reviewer who looks for failure',lead:'Use the original contract to challenge the diff.',prompt:'Review the attached diff against the payment retry contract. Do not edit files.\n\nLook for concurrent duplicates, changed-payload acceptance, timeout ambiguity, sensitive logs, missed callers and unrelated changes. Check assertions, mocks and skipped tests.\n\nVerify proposed APIs against the installed package version and actual signatures. Flag any API you cannot confirm.\n\nFor each concrete finding, give severity, file location, evidence and a reproducible failing scenario. List checks you could not perform. If no concrete issue emerges, say so.',result:'Look for reproducible findings rather than a general “looks good.”'},
{id:'loop',group:'Prompt library',name:'Stop repeated failures',slides:'Slide 12',mode:'ASK',title:'New evidence before another retry',lead:'Pause when the same strategy produces the same failure.',prompt:'Pause further edits. The same failure has repeated.\n\nSummarize the attempted changes, exact failing commands and observed output from this session. Identify whether the likely blocker is the hypothesis, environment, missing access or specification.\n\nPropose one evidence-gathering step that could distinguish the causes. Do not repeat the previous fix without new evidence.\n\nState a bounded next step and a stop condition. If you lack the command output, request it.',result:'Look for a new hypothesis or missing evidence, with a clear stop condition.'},
{id:'tokens',group:'Prompt library',name:'Token economics',slides:'Slides 16–17',mode:'ASK',title:'The cost of the whole task',lead:'One user prompt can lead to multiple model calls. These rates are hypothetical API rates, not a Copilot price quote.',prompt:'Calculate model cost for this hypothetical example.\n\nRates: $2 per million input tokens and $8 per million output tokens. No caching or tool charges.\nA: 10 calls, each with 40,000 input and 2,000 output tokens.\nB: 5 calls, each with 8,000 input and 1,000 output tokens.\n\nShow total input and output, the cost formula, each total cost and the A/B ratio. Do not treat the ratio as a measured productivity result or a GitHub Copilot price.\n\nExplain how history, model-visible tool results, retries and workers could change task consumption.',result:'Look for totals across all calls and explicit assumptions.'},
{id:'budget',group:'Prompt library',name:'Model choice and budgets',slides:'Slide 18',mode:'PLAN',title:'A budget tied to verified work',lead:'Account for failed attempts and review effort when comparing models.',prompt:'Propose a model and spend strategy for this coding task using the actual models, prices and policy information I provide. Ask for missing details. Do not invent plan allowances.\n\nUse a suitable model for routine work and define when to escalate a difficult diagnosis. Compare total task cost, including retries and rework. Set an iteration or spend limit and a review checkpoint.\n\nExplain how the available usage dashboard will measure consumption. Keep context-window capacity separate from billed token usage.\n\nReturn a short recommendation with assumptions and unresolved information.',result:'Look for a suitable model, an escalation rule and a bounded budget.'},
{id:'handoff',group:'Prompt library',name:'Cache and compaction',slides:'Slide 18 / Appendix A4',mode:'ASK',title:'A handoff that preserves decisions',lead:'Summarize old discussion without losing the facts needed for the next step.',prompt:'Create a compact handoff for continuing this coding task in a new session. Do not edit code.\n\nPreserve the goal, agreed contract, constraints, decisions and reasons, changed files, exact check results, unresolved failures and next step. Distinguish observed results from proposed actions.\n\nRemove repeated discussion and unrelated context. Flag facts that need rechecking.\n\nDo not assume a new session retains this history or a provider cache. Caching and summarizing context are separate mechanisms.',result:'Look for enough evidence to resume without rereading the entire conversation.'},
{id:'swarm',group:'Prompt library',name:'Agent swarms',slides:'Slides 19–20 / Appendix A5',mode:'PLAN',title:'Independent jobs, one integration owner',lead:'Parallel work helps when tasks can overlap without competing for the same files.',prompt:'Decide whether this payment retry task benefits from multiple agents. Do not launch agents or edit files.\n\nCompare one agent with a code owner plus read-only concurrency and test reviewers. Assign each worker a bounded question and a compact output with evidence. Identify shared-file conflicts and duplicated context.\n\nFor independent write tasks, propose separate branches or worktrees. Name one integration owner and the combined checks to rerun.\n\nInclude coordination and model-call overhead. Recommend a single agent if the work is too small or tightly coupled to justify delegation.',result:'Look for independent work, clear ownership and integration evidence.'},
{id:'accept',group:'Prompt library',name:'Before accepting a change',slides:'Slides 21–22',mode:'ASK',title:'Evidence before keeping the change',lead:'You own the engineering decision, including what remains unverified.',prompt:'Prepare an acceptance summary for the attached coding change. Do not merge, push, publish or deploy.\n\nState the original goal and actual behavior changed. List changed files and any contract or dependency changes. Summarize the regression evidence, executed checks, skipped checks and verification limits.\n\nConfirm whether tool use stayed within scope and budget. Identify unresolved risks and the human review decisions still needed.\n\nUse observed evidence only. If the diff or check output is missing, request it.',result:'Look for an accurate account of the change and its remaining limits.'}
];
let index=0, remaining=0, timer=null;const screen=document.getElementById('screen'),toast=document.getElementById('toast');let toastHandle;
function notify(message){toast.textContent=message;clearTimeout(toastHandle);toastHandle=setTimeout(()=>toast.textContent='',3000)}
function stopTimer(){if(timer)clearInterval(timer);timer=null}
function drawClock(){const e=document.getElementById('clock');if(e)e.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')}
function render(){stopTimer();const d=screens[index];screen.replaceChildren();const el=(tag,value,cls)=>{const n=document.createElement(tag);n.textContent=value;if(cls)n.className=cls;return n};screen.append(el('div',d.group+' · '+d.slides+(d.mode?' · '+d.mode:''),'meta'));const title=el('h1',d.title);title.id='title';screen.append(title,el('p',d.lead,'lead'));if(d.case){const c=el('div','','case');c.append(el('strong','The scenario'),el('div',d.case));screen.append(c)}if(d.steps){const ol=el('ol','','task');d.steps.forEach(s=>ol.append(el('li',s)));screen.append(ol)}if(d.minutes){remaining=d.minutes*60;const t=el('div','','timer'),clock=el('span','','clock');clock.id='clock';clock.setAttribute('role','timer');const start=el('button','Start '+d.minutes+'-minute timer'),reset=el('button','Reset'),hint=el('span','','timer-note');start.addEventListener('click',()=>{if(timer){stopTimer();start.textContent='Resume timer';return}if(!remaining)remaining=d.minutes*60;start.textContent='Pause timer';hint.textContent='';const end=Date.now()+remaining*1000;timer=setInterval(()=>{remaining=Math.max(0,Math.ceil((end-Date.now())/1000));drawClock();if(!remaining){stopTimer();start.textContent='Start again';hint.textContent='Time is up. Compare your approach.'}},250)});reset.addEventListener('click',()=>{stopTimer();remaining=d.minutes*60;drawClock();start.textContent='Start '+d.minutes+'-minute timer';hint.textContent=''});t.append(clock,start,reset,hint);screen.append(t);drawClock()}const box=el('section','','prompt'),head=el('div','','prompt-head'),copy=el('button','Copy prompt','primary');copy.id='copy';copy.addEventListener('click',()=>copyPrompt(d.prompt));head.append(el('strong',d.group==='Live exercises'?'COPYABLE EXERCISE PROMPT':'PROMPT TO PASTE'),copy);const pre=el('pre',d.prompt);pre.id='prompt';if(d.group==='Live exercises'){pre.hidden=true;const toggle=el('button','Show prompt');toggle.setAttribute('aria-expanded','false');toggle.addEventListener('click',()=>{pre.hidden=!pre.hidden;toggle.textContent=pre.hidden?'Show prompt':'Hide prompt';toggle.setAttribute('aria-expanded',String(!pre.hidden))});head.insertBefore(toggle,copy)}box.append(head,pre);screen.append(box,el('p',d.result,'result'));document.querySelectorAll('.sidebar a').forEach((a,i)=>{if(i===index)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.getElementById('jump').value=d.id;document.getElementById('position').textContent=(index+1)+' / '+screens.length+' · '+d.slides;document.getElementById('previous').disabled=index===0;document.getElementById('next').disabled=index===screens.length-1;window.scrollTo(0,0)}
async function copyPrompt(value){try{if(!navigator.clipboard?.writeText)throw Error('Clipboard unavailable');await navigator.clipboard.writeText(value);notify('Prompt copied')}catch{const a=document.createElement('textarea');a.value=value;a.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch{}a.remove();if(ok)notify('Prompt copied');else{let manual=document.querySelector('.manual-copy');if(!manual){manual=document.createElement('textarea');manual.className='manual-copy';manual.setAttribute('aria-label','Select and copy the prompt');document.querySelector('.prompt').append(manual)}manual.value=value;manual.focus();manual.select();notify('Select the prompt and copy with Ctrl/Cmd+C')}}}
const nav=document.getElementById('nav'),jump=document.getElementById('jump');let group='';screens.forEach((d,i)=>{if(d.group!==group){const l=document.createElement('div');l.className='nav-label';l.textContent=d.group;nav.append(l);group=d.group}const a=document.createElement('a');a.href='#'+d.id;a.textContent=d.name;nav.append(a);const option=document.createElement('option');option.value=d.id;option.textContent=d.name+' · '+d.slides;jump.append(option)});
function go(i){if(i<0||i>=screens.length)return;location.hash=screens[i].id}
function loadHash(){const n=screens.findIndex(d=>d.id===location.hash.slice(1));index=n<0?0:n;render()}
window.addEventListener('hashchange',loadHash);jump.addEventListener('change',()=>location.hash=jump.value);document.getElementById('previous').addEventListener('click',()=>go(index-1));document.getElementById('next').addEventListener('click',()=>go(index+1));document.getElementById('view').addEventListener('click',e=>{const active=document.body.classList.toggle('present');e.currentTarget.setAttribute('aria-pressed',String(active));e.currentTarget.textContent=active?'Show navigation':'Presentation view'});document.getElementById('full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{notify('Use your browser’s full-screen control')}});document.addEventListener('fullscreenchange',()=>document.getElementById('full').textContent=document.fullscreenElement?'Exit full screen':'Full screen');document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(index+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(index-1)}});loadHash();
</script></body></html>
